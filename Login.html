
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up Page</title>
    <link rel="stylesheet" href="login_style.css">
</head>
<body>

    <div class="form-container">
        <h2 id="formTitle">Login</h2>

        <form id="authForm" onsubmit="event.preventDefault(); handleSubmit();">

            <label for="username">Username</label>
            <input type="text" id="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" required>

            <!-- Show Password Checkbox -->
            <div class="show-password" id="showPasswordContainer">
                <input
                    type="checkbox"
                    id="showPassword"
                    onclick="togglePasswordVisibility()"
                >
                <label for="showPassword">Show Password</label>
            </div>

            <!-- Confirm Password -->
            <label
                for="confirmPassword"
                id="confirmPasswordLabel"
                style="display: none;"
            >
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                style="display: none;"
            >

            <!-- Password Match Message -->
            <p
                id="passwordMatchMessage"
                style="font-size: 14px; display: none;"
            ></p>

            <!-- Submit Button -->
            <button type="submit" id="submitButton">Login</button>

            <!-- Error Message -->
            <p id="errorMessage" style="color: red;"></p>

            <!-- Switch Between Login and Sign Up -->
            <p id="toggleText">
                Don't have an account?
                <a href="#" onclick="toggleForm(); return false;">Sign Up</a>
            </p>

        </form>
    </div>

    <script>
        let isLogin = true;

        // Switch between Login and Sign Up
        function toggleForm() {
            const formTitle = document.getElementById('formTitle');
            const confirmPassword = document.getElementById('confirmPassword');
            const confirmPasswordLabel = document.getElementById('confirmPasswordLabel');
            const submitButton = document.getElementById('submitButton');
            const toggleText = document.getElementById('toggleText');
            const showPasswordContainer = document.getElementById('showPasswordContainer');
            const passwordMatchMessage = document.getElementById('passwordMatchMessage');
            const errorMessage = document.getElementById('errorMessage');

            document.getElementById('authForm').reset();

            errorMessage.textContent = '';
            passwordMatchMessage.textContent = '';
            passwordMatchMessage.style.display = 'none';

            // Reset password visibility
            document.getElementById('password').type = 'password';

            if (isLogin) {
                // Switch to Sign Up
                isLogin = false;

                formTitle.textContent = 'Sign Up';
                confirmPassword.style.display = 'block';
                confirmPasswordLabel.style.display = 'block';
                confirmPassword.required = true;

                submitButton.textContent = 'Sign Up';
                showPasswordContainer.style.display = 'none';

                toggleText.innerHTML =
                    'Already have an account? <a href="#" onclick="toggleForm(); return false;">Login</a>';

            } else {
                // Switch to Login
                isLogin = true;

                formTitle.textContent = 'Login';
                confirmPassword.style.display = 'none';
                confirmPasswordLabel.style.display = 'none';
                confirmPassword.required = false;

                submitButton.textContent = 'Login';
                showPasswordContainer.style.display = 'block';

                toggleText.innerHTML =
                    'Don\'t have an account? <a href="#" onclick="toggleForm(); return false;">Sign Up</a>';
            }
        }

        // Handle Login and Sign Up
        function handleSubmit() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            errorMessage.textContent = '';

            if (username === '' || password === '') {
                errorMessage.textContent = 'Please fill out all fields.';
                return;
            }

            if (isLogin) {
                // Retrieve saved account
                const storedUsername = localStorage.getItem('username');
                const storedPassword = localStorage.getItem('password');

                // Check whether an account exists
                if (storedUsername === null || storedPassword === null) {
                    errorMessage.textContent =
                        'No account found. Please sign up first.';
                    return;
                }

                // Compare login details with saved details
                if (
                    username === storedUsername &&
                    password === storedPassword
                ) {
                    alert('Welcome! Successfully logged in.');

                    // Open the home page
                    window.location.href = './index.html';

                } else {
                    errorMessage.textContent =
                        'Invalid username or password.';
                }

            } else {
                // Sign Up
                const confirmPassword =
                    document.getElementById('confirmPassword').value;

                if (confirmPassword === '') {
                    errorMessage.textContent =
                        'Please confirm your password.';
                    return;
                }

                if (password !== confirmPassword) {
                    errorMessage.textContent =
                        'Passwords do not match.';
                    return;
                }

                // Save account information
                localStorage.setItem('username', username);
                localStorage.setItem('password', password);

                alert('Account created successfully! You can now log in.');

                // Return to Login form
                toggleForm();
            }
        }

        // Show or Hide Password
        function togglePasswordVisibility() {
            const passwordField = document.getElementById('password');

            if (passwordField.type === 'password') {
                passwordField.type = 'text';
            } else {
                passwordField.type = 'password';
            }
        }

        // Check Whether Passwords Match
        document.getElementById('confirmPassword')
            .addEventListener('input', checkPasswordMatch);

        document.getElementById('password')
            .addEventListener('input', checkPasswordMatch);

        function checkPasswordMatch() {
            const password = document.getElementById('password').value;
            const confirmPassword =
                document.getElementById('confirmPassword').value;
            const message =
                document.getElementById('passwordMatchMessage');

            if (isLogin || confirmPassword === '') {
                message.style.display = 'none';
                message.textContent = '';
                return;
            }

            if (password === confirmPassword) {
                message.textContent = 'Passwords match.';
                message.style.color = 'green';
                message.style.display = 'block';
            } else {
                message.textContent = 'Passwords do not match.';
                message.style.color = 'red';
                message.style.display = 'block';
            }
        }
    </script>

</body>
</html>
