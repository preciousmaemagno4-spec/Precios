<!DOCTYPE html>
<html>
<head>
    <title>My Student Profile</title>
</head>
<body>

<h1>My Student Profile</h1>

<script>

// PERSONAL INFORMATION
let name = "Precios Mae Magno";
let program = "BSIT";
let year = 2;
let section = "A";

let age = 20;
let score = 85;
let day = "Tuesday";


// DISPLAY STUDENT INFORMATION
document.write("Name: " + name + "<br>");
document.write("Program: " + program + "<br>");
document.write("Year: " + year + "<br>");
document.write("Section: " + section + "<br>");
document.write("Age: " + age + "<br><br>");


// IF STATEMENT
if (age >= 18) {
    document.write("Student is an adult.<br>");
}


// IF...ELSE STATEMENT
if (score >= 75) {
    document.write("Status: PASSED<br>");
} else {
    document.write("Status: FAILED<br>");
}


// ELSE IF STATEMENT
if (score >= 90) {
    document.write("Rating: Excellent<br>");
} else if (score >= 80) {
    document.write("Rating: Very Good<br>");
} else if (score >= 75) {
    document.write("Rating: Good<br>");
} else {
    document.write("Rating: Needs Improvement<br>");
}


// SWITCH STATEMENT
switch (day) {

    case "Monday":
        document.write("Today is Monday.<br>");
        break;

    case "Tuesday":
        document.write("Today is Tuesday.<br>");
        break;

    case "Wednesday":
        document.write("Today is Wednesday.<br>");
        break;

    case "Thursday":
        document.write("Today is Thursday.<br>");
        break;

    case "Friday":
        document.write("Today is Friday.<br>");
        break;

    case "Saturday":
        document.write("Today is Saturday.<br>");
        break;

    case "Sunday":
        document.write("Today is Sunday.<br>");
        break;

    default:
        document.write("Day not recognized.<br>");
}

</script>

</body>
</html>
